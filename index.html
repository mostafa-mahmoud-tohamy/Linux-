  </head>
  <body>
    <main class="desktop" id="desktop">
      <header class="topbar">
        <button class="topbar-button activities" id="activitiesButton" aria-label="Open applications"><span data-icon="orbit" data-size="19"></span></button>
        <button class="topbar-button date-button" id="dateButton"><span id="clock">09:41</span></button>
        <div class="topbar-spacer"></div>
        <button class="topbar-button rotate-button" id="rotateScreenButton" title="تدوير الشاشة إلى وضع اللابتوب العريض" hidden>
          <svg class="ui-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.85.99 6.57 2.6L21 8"/><polyline points="21 3 21 8 16 8"/></svg>
          <span>تدوير الشاشة</span>
        </button>
        <button class="topbar-button status-button" id="quickSettingsButton" aria-label="Quick settings">
          <span data-icon="wifi" data-size="15"></span><span data-icon="sound" data-size="15"></span><span class="battery" data-icon="battery" data-size="15"></span><span>▾</span>
        </button>
      </header>

      <section class="desktop-icons" aria-label="Desktop">
        <button class="desktop-icon" data-open="computer"><span class="desktop-icon-art" data-icon="computer" data-size="38"></span><span>Computer</span></button>
        <button class="desktop-icon" data-open="documents"><span class="desktop-icon-art" data-icon="documents" data-size="38"></span><span>Documents</span></button>
        <button class="desktop-icon" data-open="pictures"><span class="desktop-icon-art" data-icon="pictures" data-size="38"></span><span>Pictures</span></button>
        <button class="desktop-icon" data-open="vscode"><span class="desktop-icon-art" data-icon="vscode" data-size="38"></span><span>VS Code</span></button>
        <button class="desktop-icon" data-open="jupyter"><span class="desktop-icon-art" data-icon="jupyter" data-size="38"></span><span>Jupyter</span></button>
        <button class="desktop-icon" data-open="terminal"><span class="desktop-icon-art" data-icon="terminal" data-size="38"></span><span>Terminal</span></button>
        <button class="desktop-icon" data-open="trash"><span class="desktop-icon-art" data-icon="trash" data-size="38"></span><span>Trash</span></button>
      </section>

      <section class="window-area" id="windowArea" aria-live="polite"></section>

      <nav class="dock" aria-label="Applications">
        <button class="dock-icon" data-open="overview" title="Show applications"><span data-icon="orbit"></span></button>
        <button class="dock-icon" data-open="files" title="Files"><span data-icon="files"></span></button>
        <button class="dock-icon" data-open="vscode" title="Visual Studio Code"><span data-icon="vscode"></span></button>
        <button class="dock-icon" data-open="jupyter" title="Jupyter Notebook / Anaconda"><span data-icon="jupyter"></span></button>
        <button class="dock-icon" data-open="terminal" title="Terminal"><span data-icon="terminal"></span></button>
        <button class="dock-icon" data-open="editor" title="Text Editor"><span data-icon="editor"></span></button>
        <button class="dock-icon" data-open="settings" title="Settings"><span data-icon="settings"></span></button>
        <span class="dock-divider"></span>
        <button class="dock-icon" data-open="trash" title="Trash"><span data-icon="trash"></span></button>
      </nav>
      <div class="show-apps" id="appLauncher" hidden>
        <button data-open="files"><span data-icon="files" data-size="30"></span>Files</button>
        <button data-open="vscode"><span data-icon="vscode" data-size="30"></span>VS Code</button>
        <button data-open="jupyter"><span data-icon="jupyter" data-size="30"></span>Jupyter Notebook</button>
        <button data-open="terminal"><span data-icon="terminal" data-size="30"></span>Terminal</button>
        <button data-open="editor"><span data-icon="editor" data-size="30"></span>Text Editor</button>
        <button data-open="settings"><span data-icon="settings" data-size="30"></span>Settings</button>
      </div>
      <div class="quick-settings" id="quickSettings" hidden>
        <div class="quick-heading">Quick Settings <button id="closeQuickSettings">×</button></div>
        <button class="quick-toggle" data-toggle="wifi"><span data-icon="wifi"></span><span><b>Wi-Fi</b><small>Connected</small></span><i>●</i></button>
        <button class="quick-toggle" data-toggle="sound"><span data-icon="sound"></span><span><b>Sound</b><small>Output: Speakers</small></span><i>●</i></button>
        <button class="quick-toggle" id="quickToggleRotate" hidden><svg class="ui-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.85.99 6.57 2.6L21 8"/><polyline points="21 3 21 8 16 8"/></svg><span><b>تدوير الشاشة</b><small>وضع اللابتوب العريض</small></span><i>●</i></button>
        <button class="quick-toggle" id="quickSwitchDevice"><svg class="ui-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg><span><b>نوع الجهاز</b><small id="currentDeviceLabel">كمبيوتر (PC)</small></span><span style="color:#7c4dff;font-weight:600;">تبديل</span></button>
        <div class="brightness"><span data-icon="brightness"></span><input type="range" min="20" max="100" value="82" aria-label="Brightness"></div>
        <div class="quick-footer">Orbit Linux · Web session</div>
      </div>
      <div class="context-menu" id="contextMenu" role="menu" hidden></div>
      <div class="dialog-overlay" id="dialogOverlay" hidden>
        <form class="system-dialog" id="systemDialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
          <h2 id="dialogTitle"></h2>
          <p class="dialog-message" id="dialogMessage"></p>
          <label class="dialog-input-label" id="dialogInputLabel"><span id="dialogLabelText"></span><input id="dialogInput" autocomplete="off"></label>
          <div class="dialog-choices" id="dialogChoices"></div>
          <div class="dialog-actions"><button type="button" class="dialog-cancel" id="dialogCancel">Cancel</button><button type="submit" class="dialog-submit" id="dialogSubmit">OK</button></div>
        </form>
      </div>
      <input class="hidden-file-input" id="uploadInput" type="file" multiple accept=".txt,.md,.json,.html,.css,.js,.svg,image/png,image/jpeg,image/gif,image/webp">
      <div class="toast" id="toast" role="status"></div>

      <!-- Device Selection Modal -->
      <div class="device-modal-overlay" id="deviceModalOverlay" hidden>
        <div class="device-modal" role="dialog" aria-modal="true" aria-labelledby="deviceModalTitle">
          <div class="device-modal-header">
            <div class="device-modal-brand">
              <span class="device-modal-logo" data-icon="orbit" data-size="44"></span>
              <h2 id="deviceModalTitle">Orbit Linux</h2>
            </div>
            <p class="device-modal-sub">مرحباً بك! يرجى تحديد نوع جهازك لتهيئة بيئة النظام وعناصر التحكم المثالية لك:</p>
          </div>
          <div class="device-cards">
            <button class="device-card" id="btnChoosePhone" type="button">
              <div class="device-card-badge">تطبيق هاتف باللمس</div>
              <div class="device-card-icon">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="5" y="2" width="14" height="20" rx="3"></rect>
                  <line x1="12" y1="18" x2="12.01" y2="18" stroke-width="2.5"></line>
                  <line x1="10" y1="5" x2="14" y2="5"></line>
                </svg>
              </div>
              <div class="device-card-content">
                <h3>هاتف ذكي (Phone)</h3>
                <p>تحكم باللمس بدون مؤشر ماوس، أزرار مريحة، مع إمكانية تدوير الشاشة لعرض لابتوب عريض.</p>
              </div>
              <span class="device-card-btn">الدخول بوضع الهاتف</span>
            </button>

            <button class="device-card" id="btnChoosePC" type="button">
              <div class="device-card-badge">سطح مكتب متكامل</div>
              <div class="device-card-icon">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="2" y="3" width="20" height="14" rx="2"></rect>
                  <line x1="8" y1="21" x2="16" y2="21"></line>
                  <line x1="12" y1="17" x2="12" y2="21"></line>
                </svg>
              </div>
              <div class="device-card-content">
                <h3>كمبيوتر / لابتوب (PC)</h3>
                <p>واجهة سطح المكتب الكاملة مع مؤشر الماوس الكلاسيكي وإدارة متقدمة للنوافذ.</p>
              </div>
              <span class="device-card-btn">الدخول بوضع الكمبيوتر</span>
            </button>
          </div>
        </div>
      </div>
    </main>
    <script src="pictures-assets.js"></script>
    <script src="app.js"></script>
  </body>
</html>
