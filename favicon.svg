<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Glow Gradient -->
    <radialGradient id="orbitBgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c4dff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0b0e14" stop-opacity="0"/>
    </radialGradient>

    <!-- Planet Core 3D Gradient -->
    <radialGradient id="planetGrad" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="28%" stop-color="#7c3aed"/>
      <stop offset="68%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>

    <!-- Inner Core Glow -->
    <linearGradient id="coreHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0"/>
    </linearGradient>

    <!-- Orbital Ring Glowing Gradient -->
    <linearGradient id="ringGradFront" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="35%" stop-color="#38bdf8"/>
      <stop offset="70%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <!-- Back Ring Gradient (darker for 3D depth behind planet) -->
    <linearGradient id="ringGradBack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338ca" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Node Glow -->
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>

    <!-- Base Shadow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dark Rounded App Icon Container for perfect browser tab contrast -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="#0d111a" stroke="rgba(124, 77, 255, 0.35)" stroke-width="2.5"/>
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#orbitBgGlow)"/>

  <!-- BACK HALF OF ORBITAL RING (Behind the Planet) -->
  <g transform="rotate(-28 64 64)">
    <path d="M 14 64 A 50 17 0 0 1 114 64" fill="none" stroke="url(#ringGradBack)" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- CENTRAL PLANET BODY -->
  <circle cx="64" cy="64" r="31" fill="url(#planetGrad)" filter="url(#glow)"/>
  <circle cx="64" cy="64" r="31" fill="url(#coreHighlight)"/>

  <!-- Stylized Elegant Tech Linux Motif inside core -->
  <!-- Subtle latitude line & modern crest -->
  <path d="M 42 58 Q 64 68 86 58" fill="none" stroke="rgba(255, 255, 255, 0.18)" stroke-width="2" stroke-linecap="round"/>
  <path d="M 46 70 Q 64 78 82 70" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Iconic minimal Linux crown/delta kernel node inside planet -->
  <circle cx="64" cy="50" r="4.5" fill="#38bdf8"/>
  <path d="M 57 66 C 58 58, 70 58, 71 66 C 71 70, 57 70, 57 66 Z" fill="rgba(255, 255, 255, 0.85)"/>
  <circle cx="64" cy="50" r="2.2" fill="#0f172a"/>

  <!-- FRONT HALF OF ORBITAL RING (In front of Planet with 3D Depth) -->
  <g transform="rotate(-28 64 64)">
    <!-- Primary Glowing Front Ring -->
    <path d="M 114 64 A 50 17 0 0 1 14 64" fill="none" stroke="url(#ringGradFront)" stroke-width="6.5" stroke-linecap="round" filter="url(#glow)"/>
    <!-- Crisp Inner Light Streak on Ring -->
    <path d="M 108 65 A 48 16 0 0 1 20 65" fill="none" stroke="rgba(255, 255, 255, 0.75)" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Orbital Satellite / Sparkling Node -->
    <circle cx="98" cy="74" r="8" fill="url(#nodeGlow)"/>
    <circle cx="98" cy="74" r="3.2" fill="#ffffff"/>
  </g>
</svg>
